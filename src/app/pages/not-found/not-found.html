<section class="min-h-screen bg-white text-text-primary">
  <div class="grid min-h-screen grid-cols-1 lg:grid-cols-[40%_60%]">
    <section class="flex flex-col bg-white px-6 py-5 sm:px-10 lg:px-14">
      <header>
        <a
          routerLink="/"
          aria-label="Go to home page"
          class="inline-flex items-center gap-2 text-sm font-bold text-text-primary no-underline"
        >
          <span class="flex h-5 w-5 items-center justify-center rounded bg-primary-main text-white">
            <mat-icon class="!h-4 !w-4 !text-base">shopping_bag</mat-icon>
          </span>

          <span>ShopFront</span>
        </a>
      </header>

      <main class="flex flex-1 items-center">
        <div class="flex w-full max-w-[25rem] flex-col">
          <h1 class="mb-8 !text-[7rem] !font-sans !font-bold !leading-none tracking-[-0.08em] text-text-primary sm:!text-[8rem] lg:!text-[9rem]">
            4<span class="text-primary-main">0</span>4
          </h1>
          <div class="flex flex-col gap-6">
            <h2 class="mt-5 text-4xl font-black leading-tight text-text-primary">
              Страница не найдена
            </h2>

            <p class="m-0 max-w-[23rem] text-base leading-8 text-text-secondary">
              К сожалению, запрашиваемая страница не существует или была удалена.
            </p>

            <a
              routerLink="/"
              class="mt-3 inline-flex h-12 w-fit min-w-[13.5rem] items-center justify-center rounded-md bg-primary-main px-7 text-sm font-bold text-white no-underline shadow-[0_12px_24px_rgba(109,61,245,0.22)] transition hover:bg-primary-hover active:bg-primary-active"
            >
              Вернуться на главную
            </a>
          </div>
        </div>
      </main>
    </section>

    <section class="hidden min-h-screen items-center justify-center overflow-hidden bg-white lg:flex">
      <img
        src="/not-found-ufo.png"
        alt="Иллюстрация с летающей тарелкой и коробкой"
        class="h-full w-full object-cover object-center"
      />
    </section>

    <section class="flex items-center justify-center px-6 pb-10 lg:hidden">
      <img
        src="/not-found-ufo.png"
        alt="Иллюстрация с летающей тарелкой и коробкой"
        class="w-full max-w-[32rem] object-contain"
      />
    </section>
  </div>
</section>
