<footer class="w-full bg-bg-footer text-text-footer">
  <div
    class="mx-auto flex w-full max-w-7xl flex-col justify-between gap-5 px-4 py-4 sm:px-6 md:flex-row md:items-center"
  >
    <div class="flex flex-col items-start gap-2.5">
      <a
        routerLink="/main"
        [attr.aria-label]="'footer.homeAria' | translate"
        class="flex items-center gap-2"
      >
        <span
          class="flex size-8 items-center justify-center rounded-lg bg-accent-footer text-text-footer-title"
          aria-hidden="true"
        >
          <span class="material-icons-outlined text-lg">shopping_bag</span>
        </span>

        <span class="text-lg font-semibold text-text-footer-title">ShopFront</span>
      </a>

      <p class="text-xs text-text-footer-muted">
        {{ 'footer.copyright' | translate }}
      </p>
    </div>

    <div
      class="flex flex-col items-start gap-3 sm:flex-row sm:items-center md:justify-end"
    >
      <a
        routerLink="/about"
        class="text-sm font-semibold text-text-footer-title transition-colors hover:text-accent-footer"
      >
        {{ 'footer.about' | translate }}
      </a>

      <span
        class="hidden h-4 w-px bg-border-footer sm:block"
        aria-hidden="true"
      ></span>

      <div class="flex items-center gap-2">
        <a
          href="https://vk.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="VK"
          class="flex size-8 items-center justify-center rounded-lg text-text-footer-title transition-colors hover:bg-accent-footer"
        >
          <img
            src="assets/icons/vk.svg"
            alt=""
            class="size-6 brightness-0 invert"
          />
        </a>

        <a
          href="https://www.instagram.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
          class="flex size-8 items-center justify-center rounded-lg text-text-footer-title transition-colors hover:bg-accent-footer"
        >
          <img
            src="assets/icons/instagram.svg"
            alt=""
            class="size-6 brightness-0 invert"
          />
        </a>

        <a
          href="https://www.facebook.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook"
          class="flex size-8 items-center justify-center rounded-lg text-text-footer-title transition-colors hover:bg-accent-footer"
        >
          <img
            src="assets/icons/facebook.svg"
            alt=""
            class="size-6 brightness-0 invert"
          />
        </a>
      </div>
    </div>
  </div>
</footer>
