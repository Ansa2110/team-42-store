<div
  class="flex w-full flex-col items-center justify-center gap-3 bg-header-accent px-6 py-2 text-sm text-bg-header sm:flex-row"
>
  <div class="flex items-center gap-2">
    <span aria-hidden="true">🔥</span>

    <span class="font-medium">
      {{ title }}
    </span>

    <span class="font-bold">
      {{ timeLeft() }}
    </span>
  </div>

  <button
    type="button"
    class="rounded-lg bg-bg-header px-3 py-1 font-semibold text-header-accent transition hover:opacity-90"
    (click)="onBannerClick()"
  >
    {{ buttonText }}
  </button>
</div>
