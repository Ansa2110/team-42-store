<header class="w-full bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-6">

    <!-- Logo -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-[#5227D6] flex items-center justify-center text-white font-bold">
        42
      </div>
      <div>
        <h1 class="text-lg font-semibold text-gray-800">Team 42 Store</h1>
        <p class="text-xs text-gray-500">Online shopping</p>
      </div>
    </div>

    <!-- Search -->
    <div class="hidden md:flex flex-1 max-w-md">
      <input
        type="text"
        placeholder="Search products..."
        class="w-full px-4 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-[#5227D6] focus:border-[#5227D6]"
      />
    </div>

    <!-- Navigation -->
    <nav class="hidden lg:flex items-center gap-6 text-sm font-medium">
      <a href="#" class="text-[#5227D6]">Home</a>
      <a href="#" class="text-gray-600 hover:text-[#5227D6] transition">Catalog</a>
      <a href="#" class="text-gray-600 hover:text-[#5227D6] transition">New Arrivals</a>
      <a href="#" class="text-gray-600 hover:text-[#5227D6] transition">Deals</a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <button class="px-4 py-2 text-sm font-medium text-white bg-[#5227D6] rounded-xl hover:bg-[#5227D6] transition">
        Login
      </button>

      <button class="px-4 py-2 text-sm font-medium text-white bg-[#5227D6] rounded-xl hover:bg-[#5227D6] transition shadow-sm">
        Cart
      </button>
    </div>

  </div>
</header>
