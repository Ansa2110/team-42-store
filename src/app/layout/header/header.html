<app-promo-countdown-banner
  title="Summer Sale ends in"
  buttonText="Shop Now"
  [endDate]="saleEndDate"
  (bannerClicked)="onPromoClicked()"
  (expired)="onPromoExpired()"
/>
<header class="w-full bg-bg-header border-b border-border-header sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-6">

    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-header-accent flex items-center justify-center text-bg-header font-bold">
        42
      </div>

      <div>
        <h1 class="text-lg font-semibold text-text-header-primary">
          Team 42 Store
        </h1>

        <p class="text-xs text-text-header-secondary">
          Online shopping
        </p>
      </div>
    </div>

    <div class="hidden md:flex flex-1 max-w-md">
      <input
        type="text"
        placeholder="Search products..."
        class="w-full px-4 py-2 rounded-xl border border-border-header text-sm focus:outline-none focus:ring-2 focus:ring-header-accent focus:border-header-accent"
      />
    </div>

    <nav class="hidden lg:flex items-center gap-6 text-sm font-medium">
      <a routerLink="/main" routerLinkActive="nav-link-active" class="text-text-header-secondary hover:text-header-accent transition">
        Home
      </a>

      <a routerLink="/catalog" routerLinkActive="nav-link-active" class="text-text-header-secondary hover:text-header-accent transition">
        Catalog
      </a>

      <a
        routerLink="/about"
        routerLinkActive="nav-link-active"
        class="text-text-header-secondary hover:text-header-accent transition"
      >
        About Us
      </a>

      <a href="" routerLinkActive="nav-link-active" class="text-text-header-secondary hover:text-header-accent transition">
        New Arrivals
      </a>

      <a href="" routerLinkActive="nav-link-active" class="text-text-header-secondary hover:text-header-accent transition">
        Deals
      </a>
    </nav>

    <div class="flex items-center gap-3">
      <button class="px-4 py-2 text-sm font-medium text-bg-header bg-header-accent rounded-xl hover:bg-header-accent-hover transition">
        Login
      </button>

      <button class="px-4 py-2 text-sm font-medium text-bg-header bg-header-accent rounded-xl hover:bg-header-accent-hover transition shadow-sm">
        Cart
      </button>
    </div>

  </div>
</header>
