<section class="px-8 max-w-screen overflow-x-hidden relative">
  <div class="flex justify-between my-2 px-4">
    <p class="text-2xl font-bold">{{ sectionTitle() }}</p>
    <a class="text-text-tertiary font-medium text-sm" routerLink="/catalog">{{ 'main.products.viewAll' | translate }}</a>
  </div>
  <div
    class="flex gap-2 overflow-x-auto flex-nowrap px-4 pb-3 scrollbar-none snap-x snap-mandatory"
  >
    @if (products(); as response) {
      @for (product of response.products; track product.id) {
        <div class="p-4 font-extrabold text-primary flex-shrink-0 snap-start">
          <app-product-card [product]="product"></app-product-card>
        </div>
      }
    }
  </div>
</section>
